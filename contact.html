<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Liên hệ - Khải Hoàn</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                Khải Hoàn
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="about.html">
                    Giới thiệu
                </a>

                <a href="contact.html">
                    Liên hệ
                </a>

                <button
                    id="darkModeBtn"
                    class="dark-btn"
                >
                    🌙
                </button>

            </div>

        </div>

    </nav>


    <!-- Form liên hệ -->

    <main class="page">

        <section class="contact-section reveal">

            <h1>
                Liên hệ
            </h1>

            <p>
                Nếu bạn muốn liên hệ với mình,
                hãy điền thông tin bên dưới.
            </p>


            <!-- Formspree -->

            <form
                action="https://formspree.io/f/YOUR_FORM_ID"
                method="POST"
                class="contact-form"
            >

                <label for="name">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nhập họ và tên"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    required
                >


                <label for="message">
                    Nội dung
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Nhập nội dung cần liên hệ..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="button"
                >
                    Gửi liên hệ
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Khải Hoàn. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
